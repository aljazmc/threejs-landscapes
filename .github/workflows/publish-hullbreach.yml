name: PUBLISH HULLBREACH
run-name: Publish package hullbreach ${{ inputs.version }} by @${{ github.actor }}

on:
    # pull requests only build the package
    pull_request:
        branches: [main]
        paths:
            [
                ".github/workflows/publish-hullbreach.yml",
                ".github/actions/preview/**",
                "packages/hullbreach/**",
            ]
    # started by ci.yml when the version of hullbreach is not in hullbreach-preview yet, or by hand
    workflow_dispatch:
        inputs:
            version:
                description: Version to publish, built from its tag @aljazmc/hullbreach@<version>; empty publishes the branch with its package.json version
                type: string
                default: ""
            force:
                description: Publish again, moving the tag, if the version is already in hullbreach-preview
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}
    cancel-in-progress: false

env:
    NODE_ENV: development
    NODE_OPTIONS: "--experimental-vm-modules"
    NODE_NO_WARNINGS: "1"

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.version && format('refs/tags/@aljazmc/hullbreach@{0}', inputs.version) || '' }}
                  persist-credentials: false

            - name: Setup NodeJS
              uses: actions/setup-node@v7
              with:
                  cache-dependency-path: "packages/hullbreach"
                  node-version: "latest"
                  cache: "yarn"

            - name: Install package manager
              run: |
                  corepack enable
                  corepack install
                  yarn install --mode update-lockfile

            - name: Install dependencies
              run: yarn install --immutable

            - name: Build package hullbreach
              run: yarn bp:hullbreach

            # a build without the game or its resources is not worth publishing
            - name: Check the game
              run: |
                  for file in index.html index.js index.css res/shooter-map.txt; do
                      if [ ! -s "packages/hullbreach/dist/$file" ]; then
                          echo "::error::packages/hullbreach/dist/$file is missing"
                          exit 1
                      fi
                  done
                  models=$(find packages/hullbreach/dist/res -name "*.glb" 2>/dev/null | wc -l)
                  if [ "$models" -eq 0 ]; then
                      echo "::error::packages/hullbreach/dist/res has no models"
                      exit 1
                  fi
                  echo "Hull Breach and $models models in packages/hullbreach/dist."

            # commits the build onto the history of hullbreach-preview, with the
            # package's documentation and license, and tags it
            - name: Commit, tag and push to hullbreach-preview
              if: github.event_name == 'workflow_dispatch'
              uses: ./.github/actions/preview
              with:
                  package: hullbreach
                  files: README.md LICENSE
                  token: ${{ secrets.GH_TOKEN }}
                  force: ${{ inputs.force }}
