name: CI
run-name: Testing quickie by @${{ github.actor }}

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    # run by hand from the Actions tab
    workflow_dispatch:
        inputs:
            publish:
                description: Version changed packages and publish the versions that are not in their preview repositories yet
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    NODE_ENV: development
    NODE_OPTIONS: "--experimental-vm-modules"
    NODE_NO_WARNINGS: "1"

jobs:
    # the asset scripts, which run on the host and not in the workspaces:
    # the shell scripts with shellcheck, the Python with ruff (ruff.toml) and
    # the lightweight Python tests (packages/*/tests/py/unit, no Blender nor
    # FluidSynth)
    scripts:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Check shell scripts
              run: |
                  shellcheck --version | head -2
                  git ls-files -z '*.sh' | xargs -0 shellcheck

            - name: Check Python scripts
              run: pipx run ruff==0.17.6 check --output-format github .

            # only the lightweight Python tests: with python3 and numpy, the
            # tests needing Blender's bpy skip themselves, and the music is
            # built but never played; without blender and fluidsynth on the
            # runner neither can run by mistake (Song.render() stops without
            # fluidsynth). ./project.sh pytests runs them all in the images.
            - name: Run Python tests
              run: |
                  for bin in blender fluidsynth; do
                      if command -v "$bin" > /dev/null; then
                          echo "::error::$bin is on the runner: the Python tests must stay lightweight"
                          exit 1
                      fi
                  done
                  python3 -m venv "$RUNNER_TEMP/venv"
                  "$RUNNER_TEMP/venv/bin/pip" install --quiet numpy
                  PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/venv/bin/python" pytests.py

    build:
        # no versions nor publishing while the scripts fail their checks
        needs: scripts
        runs-on: ubuntu-latest

        permissions:
            # pushing the version commits and tags
            contents: write
            # starting the publish-$package.yml workflows
            actions: write

        strategy:
            matrix:
                node-version: [24.x, 25.x, 26.x]

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Install package manager
              run: |
                  corepack enable
                  corepack install
                  yarn install --mode update-lockfile

            - name: Setup NodeJS ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "yarn"

            - name: Install dependencies
              run: yarn install --immutable

            # linting and the tests do not depend on the node version, only
            # the node 26 run does them; every run checks types and builds
            - name: Check linting and formatting
              if: matrix.node-version == '26.x'
              run: yarn lint

            - name: Check types
              run: yarn ct:all

            - name: Run unit tests
              if: matrix.node-version == '26.x'
              run: yarn test

            - name: Build packages
              run: yarn b:all

            # packages/*/tests/ts/e2e in Chromium against the packages' dev
            # servers, see playwright.config.ts
            - name: Install Playwright browser
              if: matrix.node-version == '26.x'
              run: yarn playwright install --with-deps chromium

            - name: Run e2e tests
              if: matrix.node-version == '26.x'
              run: yarn e2e

            # only the node 26 run versions and starts the publishing, the others just check
            # monorepo moves tags a rebase left behind, then bumps the versions of the
            # packages changed since their last version by conventional commits, see
            # monorepo.config.ts, each committed and tagged, and pushes it all;
            # pushes of the workflow token start no runs, so this does not loop
            - name: Version changed packages
              id: version
              if: matrix.node-version == '26.x' && (github.event_name == 'push' || inputs.publish)
              run: |
                  # only the latest commit is released, an older run leaves it to the newer one
                  if [ "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" != "$(git rev-parse HEAD)" ]; then
                      echo "::notice::$GITHUB_REF_NAME moved on, the run of its latest commit releases it."
                      echo "skip=true" | tee -a "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  yarn monorepo --push

            # a package is published by its own publish-$package.yml workflow, to
            # https://github.com/aljazmc/$package-preview.git, when its package.json
            # version is not tagged there yet; workflow_dispatch is the one event the
            # workflow token can start runs with
            - name: Publish new versions
              if: matrix.node-version == '26.x' && (github.event_name == 'push' || inputs.publish) && steps.version.outputs.skip != 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  PREVIEW_TOKEN: ${{ secrets.GH_TOKEN }}
                  GIT_TERMINAL_PROMPT: "0"
              run: |
                  for dir in packages/*/; do
                      p=$(basename "$dir")
                      name=$(node -p "require('./${dir}package.json').name")
                      version=$(node -p "require('./${dir}package.json').version")
                      if [ ! -f ".github/workflows/publish-$p.yml" ]; then
                          echo "$name has no publish-$p.yml workflow, not published."
                          continue
                      fi
                      repository="github.com/aljazmc/$p-preview.git"
                      if [ -n "$PREVIEW_TOKEN" ]; then
                          repository="x-access-token:${PREVIEW_TOKEN}@$repository"
                      fi
                      if [ -n "$(git ls-remote --tags "https://$repository" "refs/tags/v$version" 2>/dev/null)" ]; then
                          echo "$name@$version is already in $p-preview."
                          continue
                      fi
                      echo "Publishing $name@$version to $p-preview."
                      gh workflow run "publish-$p.yml" --ref "$GITHUB_REF_NAME" -f version="$version"
                  done
