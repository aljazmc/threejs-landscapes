name: PUBLISH PTUJ
run-name: Publish package ptuj ${{ inputs.version }} by @${{ github.actor }}

on:
    # pull requests only build the package
    pull_request:
        branches: [ main ]
        paths: [ ".github/workflows/publish-ptuj.yml", "packages/ptuj/**" ]
    # started by ci.yml when the version of ptuj is not in ptuj-preview yet, or by hand
    workflow_dispatch:
        inputs:
            version:
                description: Version to publish, built from its tag @aljazmc/ptuj@<version>; empty publishes the branch with its package.json version
                type: string
                default: ""
            force:
                description: Publish even if the version is already in ptuj-preview
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}
    cancel-in-progress: false

env:
    NODE_ENV: development
    NODE_OPTIONS: "--experimental-vm-modules"
    NODE_NO_WARNINGS: "1"

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  ref: ${{ inputs.version && format('refs/tags/@aljazmc/ptuj@{0}', inputs.version) || '' }}
                  persist-credentials: false

            - name: Setup NodeJS
              uses: actions/setup-node@v6
              with:
                  cache-dependency-path: "packages/ptuj"
                  node-version: "latest"
                  cache: "yarn"

            - name: Install package manager
              run: |
                  corepack enable
                  corepack install
                  yarn install --mode update-lockfile

            - name: Install dependencies
              run: yarn install --immutable

            - name: Build package ptuj
              run: yarn bp:ptuj

            # a build without the 3D models is not worth publishing
            - name: Check 3D models
              run: |
                  models=$(find packages/ptuj/dist/models -type f \( -name "*.glb" -o -name "*.gltf" \) 2>/dev/null | wc -l)
                  if [ "$models" -eq 0 ]; then
                      echo "::error::packages/ptuj/dist/models has no 3D models (.glb or .gltf)"
                      exit 1
                  fi
                  echo "$models 3D models in packages/ptuj/dist/models."

            - name: Configure git, commit, tag and force push
              if: github.event_name == 'workflow_dispatch'
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}
                  FORCE: ${{ inputs.force }}
              run: |
                  if [ -z "$GH_TOKEN" ]; then
                      echo "::error::GH_TOKEN secret is empty or not available to this run"
                      exit 1
                  fi
                  version=$(node -p "require('./packages/ptuj/package.json').version")
                  repository="https://x-access-token:${GH_TOKEN}@github.com/aljazmc/ptuj-preview.git"
                  if [ "$FORCE" != "true" ] && [ -n "$(git ls-remote --tags "$repository" "refs/tags/v$version")" ]; then
                      echo "::notice::@aljazmc/ptuj@$version is already in ptuj-preview."
                      exit 0
                  fi
                  cd packages/ptuj/dist
                  git config --global user.name aljazmc
                  git config --global user.email aljazmc@users.noreply.github.com
                  git config --global init.defaultBranch main
                  git config --global --type bool push.autoSetupRemote true
                  git init
                  git checkout -b main
                  git add .
                  git commit -m "feat: new package ptuj v$version"
                  git tag -a "v$version" -m "version: @aljazmc/ptuj v$version"
                  git push -f "$repository" main "refs/tags/v$version"
