name: PUBLISH PTUJ
run-name: Publish package ptuj ${{ inputs.version }} by @${{ github.actor }}

on:
    # pull requests only build the package
    pull_request:
        branches: [main]
        paths:
            [
                ".github/workflows/publish-ptuj.yml",
                ".github/actions/preview/**",
                "packages/ptuj/**",
            ]
    # started by ci.yml when the version of ptuj is not in ptuj-preview yet, or by hand
    workflow_dispatch:
        inputs:
            version:
                description: Version to publish, built from its tag @aljazmc/ptuj@<version>; empty publishes the branch with its package.json version
                type: string
                default: ""
            force:
                description: Publish again, moving the tag, if the version is already in ptuj-preview
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}
    cancel-in-progress: false

env:
    NODE_ENV: development
    NODE_OPTIONS: "--experimental-vm-modules"
    NODE_NO_WARNINGS: "1"

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  ref: ${{ inputs.version && format('refs/tags/@aljazmc/ptuj@{0}', inputs.version) || '' }}
                  persist-credentials: false

            - name: Setup NodeJS
              uses: actions/setup-node@v6
              with:
                  cache-dependency-path: "packages/ptuj"
                  node-version: "latest"
                  cache: "yarn"

            - name: Install package manager
              run: |
                  corepack enable
                  corepack install
                  yarn install --mode update-lockfile

            - name: Install dependencies
              run: yarn install --immutable

            - name: Build package ptuj
              run: yarn bp:ptuj

            # a build without the map is not worth publishing
            - name: Check the map
              run: |
                  if [ ! -s packages/ptuj/dist/map/ptuj.json ]; then
                      echo "::error::packages/ptuj/dist/map/ptuj.json is missing"
                      exit 1
                  fi
                  icons=$(find packages/ptuj/dist/icons -name "*.svg" 2>/dev/null | wc -l)
                  echo "map and $icons icons in packages/ptuj/dist."

            # commits the build onto the history of ptuj-preview, with the
            # package's documentation, license and preview, and tags it
            - name: Commit, tag and push to ptuj-preview
              if: github.event_name == 'workflow_dispatch'
              uses: ./.github/actions/preview
              with:
                  package: ptuj
                  files: README.md LICENSE preview.gif
                  token: ${{ secrets.GH_TOKEN }}
                  force: ${{ inputs.force }}
