name: PUBLISH MOONSHADOW
run-name: Publish package moonshadow ${{ inputs.version }} by @${{ github.actor }}

on:
    # pull requests only build the package
    pull_request:
        branches: [ main ]
        paths: [ ".github/workflows/publish-moonshadow.yml", "packages/moonshadow/**" ]
    # started by ci.yml when the version of moonshadow is not in moonshadow-preview yet, or by hand
    workflow_dispatch:
        inputs:
            version:
                description: Version to publish, built from its tag @aljazmc/moonshadow@<version>; empty publishes the branch with its package.json version
                type: string
                default: ""
            force:
                description: Publish even if the version is already in moonshadow-preview
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}
    cancel-in-progress: false

env:
    NODE_ENV: development
    NODE_OPTIONS: "--experimental-vm-modules"
    NODE_NO_WARNINGS: "1"

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  ref: ${{ inputs.version && format('refs/tags/@aljazmc/moonshadow@{0}', inputs.version) || '' }}
                  persist-credentials: false

            - name: Setup NodeJS
              uses: actions/setup-node@v6
              with:
                  cache-dependency-path: "packages/moonshadow"
                  node-version: "latest"
                  cache: "yarn"

            - name: Install package manager
              run: |
                  corepack enable
                  corepack install
                  yarn install --mode update-lockfile

            - name: Install dependencies
              run: yarn install --immutable

            - name: Build package moonshadow
              run: yarn bp:moonshadow

            # a build without the game or its resources is not worth publishing
            - name: Check the game
              run: |
                  for file in index.html index.js index.css res/elven-map.txt; do
                      if [ ! -s "packages/moonshadow/dist/$file" ]; then
                          echo "::error::packages/moonshadow/dist/$file is missing"
                          exit 1
                      fi
                  done
                  models=$(find packages/moonshadow/dist/res -name "*.glb" 2>/dev/null | wc -l)
                  if [ "$models" -eq 0 ]; then
                      echo "::error::packages/moonshadow/dist/res has no models"
                      exit 1
                  fi
                  echo "Moonshadow Keep and $models models in packages/moonshadow/dist."

            - name: Configure git, commit, tag and force push
              if: github.event_name == 'workflow_dispatch'
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}
                  FORCE: ${{ inputs.force }}
              run: |
                  if [ -z "$GH_TOKEN" ]; then
                      echo "::error::GH_TOKEN secret is empty or not available to this run"
                      exit 1
                  fi
                  version=$(node -p "require('./packages/moonshadow/package.json').version")
                  repository="https://x-access-token:${GH_TOKEN}@github.com/aljazmc/moonshadow-preview.git"
                  if [ "$FORCE" != "true" ] && [ -n "$(git ls-remote --tags "$repository" "refs/tags/v$version")" ]; then
                      echo "::notice::@aljazmc/moonshadow@$version is already in moonshadow-preview."
                      exit 0
                  fi
                  cd packages/moonshadow/dist
                  # the package's documentation for the preview repository
                  cp ../README.md .
                  git config --global user.name aljazmc
                  git config --global user.email aljazmc@users.noreply.github.com
                  git config --global init.defaultBranch main
                  git config --global --type bool push.autoSetupRemote true
                  git init
                  git checkout -b main
                  git add .
                  git commit -m "feat: new package moonshadow v$version"
                  git tag -a "v$version" -m "version: @aljazmc/moonshadow v$version"
                  git push -f "$repository" main "refs/tags/v$version"
